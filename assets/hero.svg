<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="0.55" stop-color="#0D1727"/>
      <stop offset="1" stop-color="#0A1020"/>
    </linearGradient>

    <linearGradient id="line" x1="180" y1="0" x2="1020" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="typingClip">
      <rect x="340" y="212" width="0" height="34">
        <animate attributeName="width"
                 values="0;520;520;0"
                 keyTimes="0;0.42;0.78;1"
                 dur="7.2s"
                 repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>

  <!-- subtle ambient glow -->
  <ellipse cx="600" cy="180" rx="310" ry="120" fill="#1D4ED8" opacity="0.08" filter="url(#blur)">
    <animate attributeName="opacity" values="0.05;0.11;0.05" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- falling particles -->
  <g fill="#93C5FD">
    <circle cx="165" cy="-12" r="2.2" opacity="0.25">
      <animate attributeName="cy" from="-12" to="372" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.38;0.15;0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="265" cy="-20" r="1.8" opacity="0.22">
      <animate attributeName="cy" from="-20" to="380" dur="14s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.3;0.12;0" dur="14s" begin="-4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="392" cy="-8" r="1.6" opacity="0.2">
      <animate attributeName="cy" from="-8" to="368" dur="12s" begin="-7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="515" cy="-18" r="2.1" opacity="0.24">
      <animate attributeName="cy" from="-18" to="378" dur="16s" begin="-6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="675" cy="-10" r="1.7" opacity="0.22">
      <animate attributeName="cy" from="-10" to="370" dur="13s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="798" cy="-14" r="2.0" opacity="0.24">
      <animate attributeName="cy" from="-14" to="374" dur="15s" begin="-9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="935" cy="-16" r="1.9" opacity="0.2">
      <animate attributeName="cy" from="-16" to="376" dur="12.5s" begin="-3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="-9" r="1.5" opacity="0.18">
      <animate attributeName="cy" from="-9" to="369" dur="17s" begin="-11s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- micro grid accents -->
  <g stroke="#334155" opacity="0.28">
    <path d="M145 95H245"/>
    <path d="M955 95H1055"/>
    <path d="M145 265H245"/>
    <path d="M955 265H1055"/>
  </g>

  <!-- center mark -->
  <g transform="translate(600 115)">
    <path d="M-70 -22H-6L18 0L-70 70H4" stroke="#3B82F6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 0L52 62L88 -18" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="600" y="185" text-anchor="middle" fill="#F8FAFC"
        font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="8">
    ZANINI
  </text>

  <rect x="180" y="198" width="840" height="1.5" fill="url(#line)" opacity="0.55"/>

  <g clip-path="url(#typingClip)">
    <text x="340" y="236" fill="#94A3B8"
          font-family="JetBrains Mono, Consolas, monospace"
          font-size="18" letter-spacing="0.8">
      building systems that feel simple.
    </text>
  </g>

  <!-- terminal cursor -->
  <rect x="340" y="218" width="10" height="22" rx="2" fill="#60A5FA">
    <animate attributeName="x"
             values="340;852;852;340"
             keyTimes="0;0.42;0.78;1"
             dur="7.2s"
             repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom micro text -->
  <text x="600" y="302" text-anchor="middle" fill="#64748B"
        font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="3">
    WEB APPS  •  AUTOMATION  •  SAAS  •  SYSTEMS
  </text>
</svg>
